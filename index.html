<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Othello — AI Portal Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned + integrity-hashed) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- pdf.js (CDN) — Data Room reference quick-view -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
  <script>
    window.PDFJS_WORKER_SRC = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = window.PDFJS_WORKER_SRC;
    }
  </script>

  <!-- Data layer (plain JS, no JSX) -->
  <script src="data.js"></script>
  <script src="dataroom-data.js"></script>

  <!-- Components / store (JSX, via Babel) -->
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="store.jsx"></script>
  <script type="text/babel" src="events.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="ClientList.jsx"></script>
  <script type="text/babel" src="ClientFile.jsx"></script>
  <script type="text/babel" src="ClientFileTabs.jsx"></script>
  <script type="text/babel" src="FortlakePreview.jsx"></script>
  <script type="text/babel" src="Overview.jsx"></script>
  <script type="text/babel" src="FormsLibrary.jsx"></script>
  <script type="text/babel" src="SourcesSettings.jsx"></script>
  <script type="text/babel" src="Chat.jsx"></script>
  <script type="text/babel" src="DemoPanel.jsx"></script>

  <!-- Data Room module (stand-alone) -->
  <script type="text/babel" src="DataRoomKB.jsx"></script>
  <script type="text/babel" src="DataRoomList.jsx"></script>
  <script type="text/babel" src="DataRoomDD.jsx"></script>
  <script type="text/babel" src="DataRoomDocViewer.jsx"></script>

  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
